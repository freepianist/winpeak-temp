# org.gradle.jvmargs is deliberately not set: any value makes Gradle fork a
# single-use daemon over a localhost socket, which crashes the JVM inside
# ASProxy64.dll on this machine. build-apk.bat passes heap and encoding through
# GRADLE_OPTS so the build stays in-process.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.daemon=false
